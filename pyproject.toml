[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipnest"
version = "1.0.0"
description = "Windows 剪贴板历史工具，纯本地，不联网"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
dependencies = ["PySide6>=6.7"]

[project.optional-dependencies]
dev = ["ruff>=0.6", "nuitka>=2.0"]

[tool.setuptools.packages.find]
include = ["app*", "core*", "ui*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.22.3

      - name: 打包
        run: >
          python -m PyInstaller
          --noconfirm --clean --onedir --noconsole
          --name ClipNest
          --distpath dist
          --workpath build/pyinstaller
          --specpath build/pyinstaller
          run.py

      - name: 整理产物
        run: |
          Copy-Item LICENSE dist\ClipNest\
          Copy-Item README.md dist\ClipNest\

      - name: 压缩产物
        run: Compress-Archive -Path dist\ClipNest -DestinationPath ClipNest-${{ github.ref_name }}-win64.zip

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: ClipNest-${{ github.ref_name }}-win64.zip
          generate_release_notes: true
